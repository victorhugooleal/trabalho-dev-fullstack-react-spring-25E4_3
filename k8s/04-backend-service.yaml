apiVersion: v1
kind: Service
metadata:
  name: cars-backend-service
  namespace: cars-devops
  labels:
    app: cars-backend
spec:
  # NodePort: expõe a aplicação fora do cluster (item 2b da diretriz)
  type: NodePort
  selector:
    app: cars-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
