apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: cars-devops
  labels:
    app: grafana
spec:
  # NodePort: apenas o Grafana fica acessível fora do cluster (item 3a da diretriz)
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
